<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#2F5A2A">
<meta name="description" content="음표와 쉼표 리듬을 듣고 똑같이 따라 치는 리듬 게임 (4~6학년 음악)">
<link rel="icon" href="animals/01.png">
<script src="https://dobbi52.github.io/games/arcade-auth.js?v=1"></script>
<title>숲속 박자 음악회</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&display=swap">
<style>
/* Layout: one framed game cabinet — top bar, isometric room, rhythm lane, dialog panel, bottom tabs */
:root{
  --frame:#4A2A12; --wood:#8E5428; --wood-mid:#B9763F; --wood-light:#D99A5B;
  --cream:#FFF4DC; --cream-2:#F3E2BE; --cream-edge:#E2C89A; --ink:#5A3418; --ink-soft:#8A6440;
  --red:#E8475A; --red-dark:#A82E3E; --green:#52B07E; --green-dark:#2F7A52; --gold:#FFD25A; --gold-dark:#C99A1E; --sky:#3E6E8E;
  --display:'Jua','Gowun Dodum','Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  --body:'Gowun Dodum','Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  color-scheme:light;
}
html,body{height:100%;margin:0;overflow:hidden;background:#2E1A0C}
body{color:var(--ink);font-family:var(--body)}
*{box-sizing:border-box}
#fit{position:fixed;left:0;right:0;top:env(safe-area-inset-top,0px);bottom:env(safe-area-inset-bottom,0px);overflow:hidden}
.game{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);transform-origin:center center;background:var(--frame);border:4px solid #2E1A0C;box-shadow:inset 0 0 0 3px var(--wood);padding:8px;display:grid;gap:6px}
.game.land{width:1000px;height:654px;grid-template-columns:666px minmax(0,1fr);grid-template-rows:48px 350px 160px minmax(0,1fr);grid-template-areas:"top top" "scene panel" "lane panel" "tabs panel"}
.game.port{width:420px;height:700px;grid-template-columns:minmax(0,1fr);grid-template-rows:auto 246px 95px minmax(0,1fr) 54px;grid-template-areas:"top" "scene" "lane" "panel" "tabs"}
.topbar{grid-area:top}.sceneWrap{grid-area:scene}.laneWrap{grid-area:lane}.panel{grid-area:panel}.tabs{grid-area:tabs}
canvas{image-rendering:pixelated;image-rendering:crisp-edges;display:block}
button{font-family:var(--display);cursor:pointer;border:none}
button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}

.topbar{display:flex;align-items:center;justify-content:space-between;gap:6px 8px;flex-wrap:wrap;background:var(--wood-mid);border-bottom:4px solid #7A4420;box-shadow:inset 0 3px 0 var(--wood-light);padding:4px 10px}
.port .logo{font-size:18px}.port .chip{font-size:13px;padding:3px 8px}
.logo{display:flex;align-items:center;gap:8px;font-family:var(--display);font-size:22px;color:var(--cream);text-shadow:2px 2px 0 #5A3418}
.logo canvas{width:32px;height:32px;border:2px solid #5A3418}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{font-family:var(--display);background:var(--cream);color:var(--ink);padding:4px 10px;border-bottom:3px solid var(--cream-edge);font-size:15px;display:flex;align-items:center;gap:6px;font-variant-numeric:tabular-nums}
.chip .star{color:var(--gold-dark)}
.chip canvas{width:16px;height:16px}

.sceneWrap{position:relative;border:3px solid #2E1A0C}
#scene,#lane{width:100%;height:100%}
.mini{position:absolute;top:6px;font-family:var(--display);font-size:13px;background:rgba(46,26,12,.82);color:var(--cream);padding:3px 8px;border:2px solid var(--wood-light)}
#soundBtn{right:6px}
#roundChip{left:6px}
.callout{position:absolute;left:18%;top:30%;transform:translateX(-50%);text-align:center;pointer-events:none;font-family:var(--display);color:var(--cream);text-shadow:3px 3px 0 #2E1A0C}
.callout b{display:block;font-size:52px;line-height:1;color:var(--gold)}
.callout span{font-size:16px;background:rgba(46,26,12,.7);padding:2px 10px}
.callout.pop b{animation:pop .25s ease-out}
@keyframes pop{from{transform:scale(1.5)}to{transform:scale(1)}}

.laneWrap{position:relative;border:3px solid #2E1A0C;cursor:pointer;touch-action:manipulation}
.phase{position:absolute;right:6px;top:4px;font-family:var(--display);font-size:13px;color:var(--cream);background:rgba(46,26,12,.75);padding:1px 8px}
.judge{position:absolute;left:12%;top:-6px;font-family:var(--display);font-size:18px;text-shadow:2px 2px 0 #2E1A0C;pointer-events:none;white-space:nowrap}
.judge.show{animation:rise .6s ease-out forwards}
@keyframes rise{from{transform:translateY(8px);opacity:1}to{transform:translateY(-10px);opacity:0}}

.panel{background:var(--cream);border:3px solid var(--wood-mid);box-shadow:inset 0 0 0 3px var(--cream-2);padding:10px;min-height:0;overflow-y:auto;overscroll-behavior:contain}
.dlg{display:grid;grid-template-columns:56px minmax(0,1fr);gap:10px;align-items:start}
.dlg .actions{grid-column:1/-1}
.dlg.solo{grid-template-columns:minmax(0,1fr)}
.panel{overflow-x:hidden}
.who{display:flex;align-items:center;gap:8px;margin:0 0 8px;font-size:13px;flex-wrap:wrap}
.who b{font-family:var(--display);font-weight:400;font-size:15px}
.who .sync{flex:1;min-width:0;color:var(--ink-soft);font-size:12px}
.who .sync.off{color:#C0392B}.who .sync.ok{color:#2E8B57}
.btn.sm{padding:4px 10px;font-size:12px;min-height:0}
.gate{position:absolute;inset:0;z-index:50;display:grid;place-items:center;background:rgba(30,40,20,.55)}
.gate[hidden]{display:none}
.gate .gbox{background:var(--cream,#FFF6DF);border:4px solid var(--cream-edge,#5A3418);box-shadow:6px 6px 0 rgba(0,0,0,.35);padding:22px 26px;text-align:center;max-width:340px}
.gate h2{font-family:var(--display);font-weight:400;font-size:28px;margin:0 0 6px}
.gate p{margin:0 0 14px;font-size:14px;line-height:1.6}
.gate .tap{width:100%}
.avatar{display:flex;flex-direction:column;align-items:center;gap:4px}
.avatar canvas{width:52px;height:52px;border:3px solid var(--wood-mid);background:#9AD6F5}
.avatar small{font-family:var(--display);background:var(--green-dark);color:#fff;padding:1px 8px;font-size:12px}
.dlg h3{font-family:var(--display);font-weight:400;font-size:18px;margin:0 0 4px;text-wrap:balance}
.dlg p{margin:0;line-height:1.5;font-size:13.5px}
.preview{margin-top:8px;background:#fff;border:3px solid var(--cream-edge);padding:6px 6px 2px}
.preview canvas{width:100%;height:auto}
.actions{display:flex;flex-direction:column;gap:6px}
.btn{background:var(--cream);color:var(--ink);font-size:15px;padding:8px 10px;border:2px solid var(--wood-mid);border-bottom-width:5px}
.btn:active{transform:translateY(2px);border-bottom-width:3px}
.btn.on{background:var(--gold)}
.tap{background:var(--red);color:#fff;font-size:28px;padding:10px 8px 8px;border:3px solid var(--red-dark);border-bottom-width:8px;line-height:1;touch-action:manipulation;user-select:none;-webkit-user-select:none}
.tap small{display:block;font-size:12px;opacity:.9;margin-top:4px}
.tap.go{background:var(--green);border-color:var(--green-dark)}
.tap:active,.tap.hit{transform:translateY(3px);border-bottom-width:4px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.row3{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}.row3 .btn{padding:8px 4px;font-size:14px}
.actions.play{height:100%}.actions.play .tap{flex:1;font-size:56px;min-height:80px}.port .actions.play .tap{font-size:44px}.actions.play .tap small{font-size:15px;margin-top:8px}

.stages{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:8px}
.stage{text-align:left;background:#fff;border:2px solid var(--cream-edge);border-bottom-width:5px;padding:6px 8px;color:var(--ink);font-size:14px}
.stage{position:relative;padding-left:32px!important}
.stage b{display:block;font-weight:400;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stage .num{position:absolute;left:7px;top:8px;width:19px;height:19px;border-radius:50%;background:var(--wood-mid);color:#fff;font-size:12px;display:grid;place-items:center;line-height:1}
.stage .tag{position:absolute;right:4px;top:4px;background:var(--red);color:#fff;font-size:10px;padding:0 4px;line-height:1.5}
.stage.inf{padding-left:10px!important}
.stage em{display:block;font-style:normal;font-family:var(--body);font-size:12px;white-space:nowrap;color:var(--ink-soft);margin-top:2px}
.stage .st{white-space:pre;color:var(--gold-dark);font-size:14px;letter-spacing:1px}
.stage.inf{width:100%;margin-top:6px;background:#2E1A0C;color:var(--gold);border-color:#7A4420}
.stage.inf em{color:var(--cream-edge)}
.stage.inf .st{color:var(--cream)}
.stage[disabled]{opacity:.5;cursor:not-allowed}
.result{text-align:center;margin-bottom:10px}
.result.compact{margin-bottom:8px;display:flex;flex-direction:column;gap:4px}
.result .rtop{display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap}
.result .rtop .stars{font-size:26px;margin:0;letter-spacing:2px}
.result.compact h3{margin:0;font-size:21px}
.result .bad{font-weight:400;color:var(--red-dark)}
.result .big2{font-family:var(--display);font-weight:400;font-size:22px;color:var(--gold-dark)}
.result.compact .coinline{margin:0;font-size:17px}
.cat.ok2{background:#DDF1E4;color:var(--green-dark)}
.rowres{display:grid;grid-template-columns:repeat(auto-fit,minmax(0,1fr));gap:6px;align-items:stretch}
.rowres .tap{grid-column:span 2;font-size:22px;padding:7px 8px 6px}.rowres .tap small{font-size:11px;margin-top:2px}.rowres:has(.tap){grid-template-columns:2fr 1fr 1fr}.rowres:has(.tap) .tap{grid-column:auto}
.actions.slim .tap{font-size:22px;padding:7px 8px 6px}.actions.slim .tap small{font-size:11px;margin-top:2px}.actions.slim .btn{padding:6px 8px}
.result h3{font-family:var(--display);font-weight:400;font-size:20px;margin:4px 0 0}
.result .big{margin:2px 0;font-family:var(--display);font-size:40px;color:var(--gold-dark);line-height:1.1}
.result .sum{margin:0;font-size:14px;color:var(--ink-soft)}
.result .coinline{justify-content:center}
.result .why{margin:6px 0 0;font-size:13.5px;color:var(--red-dark);line-height:1.5}
.result .ok{margin:4px 0 0;font-size:14px}
.stars{font-size:34px;color:var(--gold-dark);letter-spacing:4px;font-family:var(--display);margin:2px 0 6px}
.stars i{font-style:normal;color:var(--cream-edge)}
.stats{display:flex;flex-wrap:wrap;gap:6px;font-size:13.5px}
.stats span{background:var(--cream-2);padding:2px 8px}

.list{display:grid;grid-template-columns:1fr;gap:6px;margin-top:8px}
.item{display:flex;gap:8px;align-items:center;background:#fff;border:2px solid var(--cream-edge);padding:6px}
.item canvas{width:44px;height:44px;flex:none;background:var(--cream-2)}
.item>div{min-width:0;flex:1}
.item b{font-family:var(--display);font-weight:400;font-size:15px;display:block}
.item span{font-size:12px;color:var(--ink-soft);line-height:1.35;display:block}
.item.owned{border-color:var(--green)}
.shop .item{flex-wrap:wrap}
.buy{font-size:13px;padding:4px 8px;border-width:2px 2px 4px;white-space:nowrap;display:flex;align-items:center;gap:4px}
.buy canvas{width:12px;height:12px;background:none}
.buy[disabled]{opacity:.45;cursor:not-allowed}
.dexhead{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:4px 10px}
.dexhead h3{font-family:var(--display);font-weight:400;font-size:20px;margin:0}
.dexhead .coinline{margin:0}
.gacha{display:flex;flex-direction:column;gap:6px;margin:8px 0 10px}
.gacha .tap{font-size:26px}.gacha .tap[disabled]{background:#B9A88E;border-color:#8E7E66;cursor:not-allowed}
.rates{margin:0;font-size:12px;color:var(--ink-soft);line-height:1.45;text-align:center}
.card{display:flex;align-items:center;gap:10px;background:#fff;border:3px solid var(--cream-edge);padding:8px;min-height:170px}
.card img{width:88px;height:88px;object-fit:contain;flex:none}
.card div{min-width:0}.card em{display:inline-block;font-style:normal;font-family:var(--display);font-size:12px;padding:0 8px;background:var(--cream-2);color:var(--ink-soft)}
.card b{display:block;font-family:var(--display);font-weight:400;font-size:19px;margin:2px 0}
.card span{font-size:13px;color:var(--ink-soft)}
.card.blank{justify-content:center;flex-direction:column;gap:2px;text-align:center}.card.blank b{font-size:34px;color:var(--cream-edge)}
.card.t1{border-color:#3EA0C8;background:#EEF8FD}.card.t1 em{background:#3EA0C8;color:#fff}
.card.t2{border-color:var(--gold-dark);background:#FFF6D2}.card.t2 em{background:var(--gold);color:#6A3E00}
.card.pop img{animation:bounceIn .5s ease-out}
@keyframes bounceIn{0%{transform:scale(.2) rotate(-12deg);opacity:0}70%{transform:scale(1.15)}100%{transform:scale(1);opacity:1}}
#reveal{min-height:170px}
.gift{position:relative;height:170px;background:#fff;border:3px solid var(--cream-edge);overflow:hidden;cursor:pointer}
.gift img{position:absolute;left:50%;image-rendering:pixelated;pointer-events:none}
.gift .g-closed{width:112px;bottom:32px;margin-left:-56px;transform-origin:50% 100%}
.gift .g-open{width:111px;bottom:32px;margin-left:-55px;opacity:0;transform-origin:50% 100%}
.gift .g-lid{width:116px;bottom:84px;margin-left:-58px;opacity:0}
.gift .g-pet{width:80px;bottom:58px;margin-left:-40px;opacity:0;transform-origin:50% 100%}
.gift p{position:absolute;left:0;right:0;bottom:6px;margin:0;text-align:center;font-family:var(--display);font-size:13px;color:var(--ink-soft);transition:opacity .2s}
.gift .glow,.gift .rays,.gift .flash{position:absolute;pointer-events:none;opacity:0}
.gift .glow{inset:0;transition:opacity .4s}
.gift .rays{left:50%;top:50%;width:420px;height:420px;margin:-230px 0 0 -210px;border-radius:50%;transition:opacity .4s;animation:spin 6s linear infinite;
  -webkit-mask:radial-gradient(circle,#000 20%,transparent 62%);mask:radial-gradient(circle,#000 20%,transparent 62%)}
.gift .flash{inset:0;background:#fff}
.gift.g0 .glow{opacity:1;background:radial-gradient(circle at 50% 62%,rgba(255,250,235,1),rgba(255,244,220,0) 55%)}
.gift.g0 .rays{opacity:.5;background:repeating-conic-gradient(rgba(255,236,190,.9) 0 9deg,transparent 9deg 22deg)}
.gift.g1 .glow{opacity:1;background:radial-gradient(circle at 50% 62%,rgba(126,200,240,.9),rgba(62,160,200,0) 58%)}
.gift.g1 .rays{opacity:.6;background:repeating-conic-gradient(rgba(126,200,240,.85) 0 9deg,transparent 9deg 22deg)}
.gift.g2 .glow{opacity:1;background:radial-gradient(circle at 50% 62%,rgba(255,226,120,1),rgba(255,210,90,0) 62%)}
.gift.g2 .rays{opacity:.85;background:repeating-conic-gradient(rgba(255,210,90,.95) 0 9deg,transparent 9deg 18deg)}
.gift.drop .g-closed{animation:gDrop .45s cubic-bezier(.3,1.4,.6,1) both}
.gift.wiggle .g-closed{animation:gHop .55s ease-in-out infinite}
.gift.shake .g-closed{animation:gShake .1s linear infinite}
.gift.open .g-closed{opacity:0}
.gift.open .g-open{opacity:1;animation:gPop .3s ease-out}
.gift.open .g-lid{animation:gLid .55s ease-out forwards}
.gift.open .flash{animation:gFlash .4s ease-out}
.gift.open p{opacity:0}
.gift.open .rays{opacity:1}
.gift.pet .g-pet{animation:gPet .55s cubic-bezier(.25,1.5,.5,1) forwards}
.gift .sparks i{position:absolute;left:50%;bottom:90px;width:7px;height:7px;margin-left:-3px;background:#FFF6C8;box-shadow:0 0 0 2px rgba(255,210,90,.6);opacity:0}
.gift.g1 .sparks i{background:#DDF3FF;box-shadow:0 0 0 2px rgba(62,160,200,.6)}
.gift.g2 .sparks i{background:#FFE07A;box-shadow:0 0 0 2px rgba(232,71,90,.5)}
.gift.open .sparks i{animation:gSpark .7s ease-out var(--d) forwards}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes gDrop{0%{transform:translateY(-150px) scale(.9,1.1)}70%{transform:translateY(0) scale(1.15,.82)}100%{transform:translateY(0) scale(1)}}
@keyframes gHop{0%,100%{transform:translateY(0) scale(1)}10%{transform:translateY(0) scale(1.08,.9)}40%{transform:translateY(-16px) rotate(-6deg) scale(.96,1.05)}60%{transform:translateY(-16px) rotate(6deg)}85%{transform:translateY(0) scale(1.06,.94)}}
@keyframes gShake{0%,100%{transform:translateX(0) rotate(0) scale(1.1)}25%{transform:translateX(-4px) rotate(-8deg) scale(1.12)}75%{transform:translateX(4px) rotate(8deg) scale(1.12)}}
@keyframes gPop{0%{transform:scale(1.25,.8)}100%{transform:scale(1)}}
@keyframes gLid{0%{opacity:1;transform:translate(0,0) rotate(0)}60%{opacity:1}100%{opacity:0;transform:translate(46px,-90px) rotate(38deg)}}
@keyframes gFlash{0%{opacity:.95}100%{opacity:0}}
@keyframes gPet{0%{opacity:0;transform:translateY(40px) scale(.3)}100%{opacity:1;transform:translateY(-20px) scale(1)}}
@keyframes gSpark{0%{opacity:1;transform:translate(0,0) scale(1.2)}100%{opacity:0;transform:translate(var(--dx),var(--dy)) scale(.4)}}
@media (prefers-reduced-motion:reduce){.gift *{animation:none!important}}
.dex{display:flex;flex-direction:column;gap:8px}
.gname{display:flex;justify-content:space-between;font-family:var(--display);font-size:14px;border-bottom:2px solid var(--cream-edge);margin-bottom:4px}
.gname b{font-weight:400}.gname span{color:var(--ink-soft);font-variant-numeric:tabular-nums}
.cells{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:4px}
.cell{position:relative;background:#fff;border:2px solid var(--cream-edge);padding:3px 2px 2px;text-align:center}
.cell img{width:100%;aspect-ratio:1;object-fit:contain;display:block}
.cell small{display:block;font-size:9px;letter-spacing:-0.3px;color:var(--ink-soft);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cell i{position:absolute;right:2px;top:1px;font-style:normal;font-family:var(--display);font-size:11px;background:var(--ink);color:var(--cream);padding:0 4px}
.stagehint{margin:0 0 8px;font-size:12.5px;color:var(--green-dark);text-align:center}
button.cell{font:inherit;cursor:pointer;color:inherit}
.cell u{position:absolute;left:2px;top:1px;text-decoration:none;font-family:var(--display);font-size:11px;background:var(--green);color:#fff;padding:0 4px}
.cell.onstage{outline:3px solid var(--green);outline-offset:-1px}
.cell.t1{border-color:#3EA0C8}.cell.t2{border-color:var(--gold-dark);background:#FFF6D2}
.cell.locked{background:var(--cream-2);border-color:var(--cream-edge)}.cell.locked img{filter:brightness(0);opacity:.16}
@media (prefers-reduced-motion:reduce){.card.pop img{animation:none}}
.coinline{display:flex;align-items:center;gap:6px;font-family:var(--display);font-size:16px;margin-top:6px}
.coinline canvas{width:18px;height:18px}
.item span.cat,.cat{display:inline-block;font-family:var(--display);font-size:11px;background:var(--cream-2);color:var(--ink-soft);padding:0 6px;margin-left:4px;vertical-align:2px}
.ok{color:var(--green-dark);font-family:var(--display)}

.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.tab{background:var(--cream);color:var(--ink);font-size:17px;padding:6px 4px;border:3px solid var(--wood-mid);border-bottom-width:6px;display:flex;align-items:center;justify-content:center;gap:8px}
.tab canvas{width:22px;height:22px}
.tab[aria-selected="true"]{background:var(--gold);border-color:var(--gold-dark)}
.keyhint{font-size:12px;color:var(--ink-soft);margin-top:6px}
}
@media (prefers-reduced-motion:reduce){.callout.pop b,.judge.show{animation:none}}
</style>
</head>
<body>
<div id="fit"><div class="game land" id="game">
  <div class="gate" id="gate" hidden><div class="gbox"><h2>숲속 박자 음악회</h2><p>생각 오락실 계정으로 로그인하면<br>어느 기기에서든 기록이 이어져요.</p><button class="tap go" id="gateBtn">로그인 · 가입<small>생각 오락실 통합 계정</small></button></div></div>
  <header class="topbar">
    <div class="logo"><canvas id="logo" width="12" height="12"></canvas><span>숲속 박자 음악회</span></div>
    <div class="chips">
      <div class="chip" id="stageChip">1단계</div>
      <div class="chip"><span class="star">★</span><span id="starCount">0</span></div>
      <div class="chip"><canvas width="8" height="8" data-icon="coin"></canvas><span id="coinCount">0</span></div>
    </div>

const G={

function glyph(c,rows,x,y,px,col){c.fillStyle=col;rows.forEach((r,j)=>{for(let i=0;i<r.length;i++)if(r[i]==='#')c.fillRect(Math.round(x+i*px),Math.round(y+j*px),px,px);});}
function sprite(c,rows,x,y,px,pal){rows.forEach((r,j)=>{for(let i=0;i<r.length;i++){const k=pal[r[i]];if(k){c.fillStyle=k;c.fillRect(Math.round(x+i*px),Math.round(y+j*px),px,px);}}});}
/* draw one rhythm event; hx = note-head centre */
function drawEvent(c,e,hx,top,px,col,restBg){
  if(e.rest){const w=10*px,h=19*px;c.fillStyle=restBg;c.fillRect(Math.round(hx-w/2),top-2*px,w,h);
    if(e.type==='er')glyph(c,G.erest,hx-3.5*px,top+4*px,px,col);else glyph(c,G.rest,hx-3*px,top,px,col);return;}
  const x=hx-2.5*px;
  glyph(c,(e.type==='h'||e.type==='dh')?G.half:G.note,x,top,px,col);
  if(e.type==='dq'||e.type==='dh'||e.type==='de'){c.fillStyle=col;c.fillRect(Math.round(x+7*px),Math.round(top+12*px),2*px,2*px);}
  if(!e.grp&&(e.type==='e'||e.type==='de'||e.type==='s'))glyph(c,G.flag.map(r=>r.slice(5)),x+5*px,top,px,col);

function drawSeq(c,evs,xs,top,px,colOf,bgOf,show){const st=[];evs.forEach((e,i)=>{if(show&&!show(i))return;st[i]=drawEvent(c,e,xs[i],top,px,colOf(i),bgOf(i));});

    g.forEach((i,k)=>{if(evs[i].type!=='s')return;const y=top+Math.round(3.5*px),h=Math.round(2*px),nx=g[k+1]!=null&&evs[g[k+1]].type==='s',pv=g[k-1]!=null&&evs[g[k-1]].type==='s';
      if(nx)c.fillRect(Math.round(st[i]),y,Math.round(st[g[k+1]]-st[i])+px,h);else if(!pv){const r=g[k+1]!=null;c.fillRect(Math.round(r?st[i]:st[i]-4*px),y,5*px,h);}});});}

 if(!noiseBuf){noiseBuf=ac.createBuffer(1,ac.sampleRate*0.1,ac.sampleRate);const d=noiseBuf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*(1-i/d.length);}

function startRound(){

  const st=curStage(),beat=60/st.bpm,ev=curEvents(),T0=a.currentTime+0.45;
  const L=layout(ev.bars,save.listen);
  const mk=(off)=>ev.map(e=>({...e,t:(off+e.start/4)*beat,end:(off+(e.start+e.dur)/4)*beat,res:null,shown:false}));
  holding=null;run={T0,beat,L,listen:L.listen?mk(L.ls):[],play:mk(L.ps),combo:0,maxCombo:0,taps:[],extra:0,done:false};
  for(let b=0;b<L.pe;b++){const inCount=(b<L.ls)||(b>=L.le&&b<L.ps);if(inCount||save.metro)click(T0+b*beat,b%4===0,inCount?1:0.55);}
  run.listen.forEach(e=>{if(!e.rest)drum(T0+e.t,170);});
  state='run';renderPlay();
}
const PERFECT=0.08,GOOD=0.15;
const HOLD_T={h:1,dh:1,w:1};let holding=null;
const holdNeed=e=>{const d=e.end-e.t;return d-Math.min(0.15,0.2*d);};
function startHold(e){if(HOLD_T[e.type]){holding=e;e.holding=true;}}
function holdDone(){const e=holding;if(!e)return;holding=null;e.holding=false;e.held=true;addPart(...P(...SPOT.kit),'spark','#7FE0A8',-30,.5);}
function endHold(now){const e=holding;if(!e)return;if(state==='run'&&run)now-=run.T0;holding=null;e.holding=false;const dur=e.end-e.t,held=now-e.t;
  if(held>=holdNeed(e)){e.held=true;return;}
  e.short=true;const endless=state==='inf'&&inf;
  if(held<dur*0.25){e.res='miss';if(endless){infHurt('짧아요!');}else if(run){run.combo=0;judgeShow('짧아요! 꾹 눌러요','#FF8A96');}return;}
  if(e.res==='perfect'){e.res='good';if(endless){inf.perfect--;inf.good++;inf.score=Math.max(0,inf.score-50);}}
  judgeShow('짧아요!','#FFB066');}
function drawTail(c,e,x0,xEnd,ghost){const x1=Math.round(x0),x2=Math.round(xEnd)-10;if(x2<=x1+4)return;
  c.fillStyle=ghost?'rgba(58,34,16,0.35)':'#3A2210';c.fillRect(x1,51,x2-x1+2,14);
  c.fillStyle=ghost?'rgba(255,244,220,0.18)':'#8C7354';c.fillRect(x1,53,x2-x1,10);
  if(!ghost&&(e.holding||e.held||e.short)){const xf=e.holding?Math.max(x1,Math.min(x2,HITX)):x2;c.fillStyle=e.held?'#7FE0A8':e.short?'#FFB066':'#FFD25A';c.fillRect(x1,53,xf-x1,10);}
  if(!ghost){c.fillStyle=e.held?'#7FE0A8':'#FFF4DC';c.fillRect(x2-3,49,4,18);}}
function holdTick(now){if(holding&&state==='run'&&run)now-=run.T0;if(holding&&now>=holding.t+holdNeed(holding))holdDone();}
addEventListener('pointerup',()=>{if(holding&&ac)endHold(ac.currentTime);});
addEventListener('pointercancel',()=>{if(holding&&ac)endHold(ac.currentTime);});
addEventListener('keyup',e=>{if((e.code==='Space'||e.key===' ')&&holding&&ac)endHold(ac.currentTime);});
function judgeShow(text,col){const j=document.getElementById('judge');j.textContent=text;j.style.color=col;j.classList.remove('show');void j.offsetWidth;j.classList.add('show');}
function tap(){
  if(state==='inf'){infTap();return;}
  if(state==='ready'||state==='result'){if(state==='result')return;startRound();return;}
  if(state!=='run'||!run)return;
  const now=ac.currentTime,rel=now-run.T0;drum(now,210);hitFx(true);
  const btn=document.getElementById('tapBtn');if(btn){btn.classList.add('hit');setTimeout(()=>btn.classList.remove('hit'),90);}
  const ps=run.L.ps*run.beat,pe=run.L.pe*run.beat;
  if(rel<ps-0.25||rel>pe+0.1)return;
  let best=null,bd=9;run.play.forEach(e=>{if(!e.rest&&!e.res){const d=Math.abs(rel-e.t);if(d<bd){bd=d;best=e;}}});
  if(best&&bd<=GOOD){const pf=bd<=PERFECT;best.res=pf?'perfect':'good';startHold(best);run.combo++;run.maxCombo=Math.max(run.maxCombo,run.combo);
    judgeShow((pf?'딱 맞아요!':'좋아요!')+(run.combo>1?' '+run.combo+'콤보':''),pf?'#7FE0A8':'#FFD25A');cheerFx(pf);return;}
  const r=run.play.find(e=>e.rest&&rel>e.t+0.06&&rel<e.end-0.06);
  if(r&&r.res!=='broke'){r.res='broke';run.combo=0;judgeShow('쉼표예요! 쉬어요','#FF8A96');return;}
  run.extra++;run.combo=0;judgeShow('헛박!','#FF8A96');
}
function tick(now){
  if(state==='inf'){infTick(now);return;}
  if(state!=='run'||!run)return;
  const rel=now-run.T0;
  run.listen.forEach(e=>{if(!e.rest&&!e.shown&&rel>=e.t){e.shown=true;hitFx(false);}});
  run.play.forEach(e=>{
    if(!e.rest&&!e.res&&rel>e.t+GOOD){e.res='miss';run.combo=0;judgeShow('놓쳤어요','#FF8A96');}
    if(e.rest&&!e.res&&rel>e.end-0.06){e.res='keep';judgeShow('잘 쉬었어요!','#9FD8FF');}
  });
  const b=Math.floor(rel/run.beat),co=document.getElementById('callout');
  const L=run.L;let html='';if(b>=0&&b<L.ls)html=`<b>${b+1}</b><span>${L.listen?'잘 들어 보세요':'이제 따라 쳐요!'}</span>`;else if(b>=L.le&&b<L.ps)html=`<b>${b-L.le+1}</b><span>이제 따라 쳐요!</span>`;else if(rel<0)html='<b>♪</b><span>준비</span>';
  if(co.dataset.k!==String(b)){co.dataset.k=b;co.innerHTML=html;co.classList.remove('pop');void co.offsetWidth;if(html)co.classList.add('pop');}
  const bt=rel/run.beat;document.getElementById('phase').textContent=bt<L.ls?'준비':bt<L.le?'들어 보기 · '+(Math.floor((bt-L.ls)/4)+1)+'마디':bt<L.ps?'준비':'따라 치기 · '+Math.min(L.pe-L.ps>>2,Math.floor((bt-L.ps)/4)+1)+'마디';
  if(rel>L.pe*run.beat+0.3&&!run.done){run.done=true;finishRound();}
}
function finishRound(){
  const p=run.play,notes=p.filter(e=>!e.rest),rests=p.filter(e=>e.rest);
  let pts=0;notes.forEach(e=>pts+=e.res==='perfect'?100:e.res==='good'?60:0);rests.forEach(e=>pts+=e.res==='keep'?100:0);
  pts-=Math.min(run.extra,3)*15;
  const ratio=Math.max(0,pts/(p.length*100));
  const stars=ratio>=0.92?3:ratio>=0.75?2:ratio>=0.5?1:0;
  const prevBest=save.best[stageIdx][roundIdx],newStars=Math.max(0,stars-prevBest);
  const nP=notes.filter(e=>e.res==='perfect').length,nG=notes.filter(e=>e.res==='good').length;
  const mult=stageIdx+1,coinGain=(stars*8+nP*2+nG)*mult+newStars*15;save.coins+=coinGain;
  const nMiss=notes.filter(e=>e.res==='miss').length,nBroke=rests.filter(e=>e.res==='broke').length;
  const pass=nMiss===0&&nBroke===0&&run.extra===0&&(!strict(stageIdx)||nG===0);
  if(pass)save.pass[stageIdx][roundIdx]=true;
  save.best[stageIdx][roundIdx]=Math.max(prevBest,stars);persist();
  lastResult={stars,perfect:notes.filter(e=>e.res==='perfect').length,good:notes.filter(e=>e.res==='good').length,miss:notes.filter(e=>e.res==='miss'&&!e.short).length,short:notes.filter(e=>e.short).length,notes:notes.length,keep:rests.filter(e=>e.res==='keep').length,rests:rests.length,broke:nBroke,extra:run.extra,pass,strict:strict(stageIdx),coins:coinGain,mult,newStars,canBuy:save.coins>=GACHA_COST};
  if(stars>=2&&has('confetti'))confettiFx();
  if(stars>0)chime(ac.currentTime+0.05,stars===3?660:523);
  state='result';document.getElementById('callout').innerHTML='';document.getElementById('phase').textContent='결과';
  
  updateTop();renderPlay();
}

  const sparks=Array.from({length:16},(_,i)=>{const a=i/16*Math.PI*2+Math.random()*0.3,d=70+Math.random()*50;return `<i style="--dx:${Math.round(Math.cos(a)*d)}px;--dy:${Math.round(Math.sin(a)*d*0.8-20)}px;--d:${(Math.random()*0.15).toFixed(2)}s"></i>`;}).join('');
  box.innerHTML=`<div class="gift drop"><div class="rays"></div><div class="glow"></div><div class="flash"></div>
    <img class="g-pet" src="animals/${pad2(r.a.id)}.png" alt=""><img class="g-open" src="ui/gift_open.png" alt=""><img class="g-lid" src="ui/gift_lid.png" alt=""><img class="g-closed" src="ui/gift_closed.png" alt="선물 상자">
    <div class="sparks">${sparks}</div><p>무엇이 나올까요?</p></div>`;
  const g=box.querySelector('.gift'),timers=[],au=audio();let sang=false;
  if(au){let t=au.currentTime+0.5,gap=0.16;while(t<au.currentTime+1.55){drum(t,130+(t-au.currentTime)*70);t+=gap;gap=Math.max(0.04,gap*0.83);}}
  const sing=()=>{if(sang)return;sang=true;const a2=audio();if(a2){chime(a2.currentTime+0.02,[523,659,784][r.a.tier]);if(r.a.tier>=1)chime(a2.currentTime+0.28,[523,659,784][r.a.tier]*1.5);}};
  const finish=()=>{if(!drawAnim)return;timers.forEach(clearTimeout);drawAnim=null;lastDraw=r;sing();
    if(r.a.tier===2||(r.n===1&&r.a.tier===1))confettiFx();updateTop();const st=el.scrollTop;renderRoom();el.scrollTop=st;};
  drawAnim={finish};
  const at=(ms,fn)=>timers.push(setTimeout(fn,ms));
  at(450,()=>{g.classList.replace('drop','wiggle');});
  at(1000,()=>{g.classList.replace('wiggle','shake');});
  at(1100,()=>{g.classList.add('g'+r.a.tier);});
  at(1550,()=>{g.classList.replace('shake','open');const a2=audio();if(a2)drum(a2.currentTime,320);});
  at(1750,()=>{g.classList.add('pet');sing();});
  at(2600,finish);
  box.onclick=()=>{if(drawAnim)drawAnim.finish();};
}

    arr.forEach((e,i)=>{if(!vis(i))return;const hx=X(e.t),len=(e.end-e.t)*speed;if(!HOLD_T[e.type]){c.fillStyle=e.rest?'rgba(159,216,255,0.35)':ghost?'rgba(255,244,220,0.18)':'rgba(255,244,220,0.3)';c.fillRect(Math.round(hx),LH-16,Math.max(2,Math.round(len-3)),4);}if(HOLD_T[e.type]&&!e.rest)drawTail(c,e,hx,X(e.end),ghost);});
    drawSeq(c,arr,arr.map(e=>X(e.t)),NT,PX,colOf,()=>'transparent',vis);};
  draw(listen,true);draw(play,false);

 ['q r q q','q q r q','r q q q','h r q','q r h','r q r q'],
 ['e e q q q','q e e q q','e e e e q q','q q e e e e','e e q e e q','h e e q','e e e e h'],
 ['dq e q q','q dq e q','dq e dq e','dh q','q dh','dq e h'],

const INF_NEW=['','4분쉼표','8분음표','점음표','엇박·8분쉼표','16분음표'];
const INF_BPM=b=>Math.min(150,92+3*Math.floor(b/4));
const INF_LEVEL=b=>Math.min(INF_POOL.length-1,1+Math.floor(b/6));
const BEAT_PX=90;
let inf=null;
function infPick(level){const pool=Math.random()<0.5?INF_POOL[level]:INF_POOL[Math.floor(Math.random()*(level+1))];return pool[Math.floor(Math.random()*pool.length)];}
function infAddBar(){const k=inf.bars.length,bpm=INF_BPM(k),beat=60/bpm,prev=inf.bars[k-1],start=prev?prev.start+4*prev.beat:inf.T0+4*beat;
  const ev=parse(infPick(INF_LEVEL(k)));inf.bars.push({start,beat,bpm});
  ev.forEach(e=>inf.events.push({...e,start:k*16+e.start,bpos:k*4+e.start/4,t:start+e.start/4*beat,end:start+(e.start+e.dur)/4*beat,res:null}));
  const all=inf.events;beamGroups(all).forEach(g=>g.forEach(i=>all[i].grp=true));}

  const frac=((cur%1)+1)%1,pulse=over?0:Math.max(0,1-frac*3);
  const dark=cur<0?Math.min(1,(cur+4)/4)*0.62:0.62;
  const [kx,ky]=P(...SPOT.kit),sx=kx,sy=ky-60;
  /* dim the room, leave a pool of light on the drummer */
  const g=c.createRadialGradient(sx,sy,30,sx,sy,260+pulse*25);g.addColorStop(0,'rgba(12,8,32,0)');g.addColorStop(0.55,'rgba(12,8,32,'+(dark*0.55)+')');g.addColorStop(1,'rgba(12,8,32,'+dark+')');
  c.fillStyle=g;c.fillRect(0,0,SW,SH);
  c.save();c.globalCompositeOperation='lighter';
  /* spotlight cone */
  c.globalAlpha=0.22+pulse*0.12;const sg=c.createLinearGradient(sx,0,sx,sy+80);sg.addColorStop(0,'rgba(255,240,180,0.9)');sg.addColorStop(1,'rgba(255,240,180,0.15)');c.fillStyle=sg;
  c.beginPath();c.moveTo(sx-30,0);c.lineTo(sx+30,0);c.lineTo(sx+150,sy+90);c.lineTo(sx-150,sy+90);c.closePath();c.fill();c.globalAlpha=1;
  /* level 1: mirror-ball spots */
  if(lv>=1)for(let i=0;i<16;i++){const ang=now*0.7+i*0.39,rx=SW/2+Math.cos(ang)*(220+(i%4)*80),ry=SH*0.55+Math.sin(ang*1.3+i)*SH*0.3;c.globalAlpha=0.35+pulse*0.25;c.fillStyle=CONF[i%6];c.beginPath();c.moveTo(rx,ry-9);c.lineTo(rx+9,ry);c.lineTo(rx,ry+9);c.lineTo(rx-9,ry);c.closePath();c.fill();}
  /* level 2: sweeping coloured beams from the top corners */
  if(lv>=2)[[0,'255,90,140',1],[SW,'90,180,255',-1]].forEach(([ox,rgb,d],k)=>{const a=Math.sin(now*0.9+k*2)*0.5,len=SH*1.4;c.globalAlpha=0.2+pulse*0.15;c.fillStyle='rgba('+rgb+',1)';
    c.beginPath();c.moveTo(ox,0);c.lineTo(ox+d*Math.cos(1.05+a-0.1)*len,Math.sin(1.05+a-0.1)*len);c.lineTo(ox+d*Math.cos(1.05+a+0.1)*len,Math.sin(1.05+a+0.1)*len);c.closePath();c.fill();});
  /* level 4: laser fan pulsing on the beat */
  if(lv>=4){c.globalAlpha=0.35+pulse*0.5;c.lineWidth=2;for(let i=0;i<9;i++){const a=Math.PI/2+(i-4)*0.16+Math.sin(now*1.5)*0.12;c.strokeStyle=i%2?'rgba(120,255,170,1)':'rgba(255,80,200,1)';c.beginPath();c.moveTo(sx,0);c.lineTo(sx+Math.cos(a)*SH*1.3,Math.sin(a)*SH*1.3);c.stroke();}}
  /* level 5: flashing floor glow */
  if(lv>=5){c.globalAlpha=pulse*0.25;c.fillStyle=CONF[bar%6];c.fillRect(0,SH*0.6,SW,SH*0.4);}
  c.restore();c.globalAlpha=1;
  /* level 3: audience light sticks */
  if(lv>=3&&!has('sticks'))drawSticks(c,now);
  if(lv>=5&&!over&&frac<0.02&&Math.floor(cur)%4===0&&inf.lastConf!==Math.floor(cur)){inf.lastConf=Math.floor(cur);for(let i=0;i<24;i++)addPart(Math.random()*SW,-10-Math.random()*40,'conf',CONF[i%CONF.length],110+Math.random()*80,2.2,{vx:Math.random()*60-30,spin:Math.random()*10});}
  /* lost a heart: red flash */
  if(inf.hurtAt&&ac&&now-inf.hurtAt<0.35){c.fillStyle='rgba(232,71,90,'+(0.35*(1-(now-inf.hurtAt)/0.35))+')';c.fillRect(0,0,SW,SH);}
}
function drawInfLane(now){
  const c=lc,LW=400,LH=96,NT=18,PX=3;c.fillStyle='#4A2C16';c.fillRect(0,0,LW,LH);c.fillStyle='#5E3A1E';c.fillRect(0,6,LW,LH-12);c.fillStyle='#7A4C28';c.fillRect(0,6,LW,2);c.fillStyle='#3A2210';c.fillRect(0,LH-8,LW,2);
  const cur=inf.over?infBeatAt(inf.endT||(inf.endT=now)):infBeatAt(now),X=b=>HITX+(b-cur)*BEAT_PX;
  for(let b=Math.ceil(cur-1);b<cur+5;b++){const x=Math.round(X(b));if(x<0||x>LW)continue;c.fillStyle=((b%4)+4)%4===0?'#A8743E':'#6E4524';c.fillRect(x,8,((b%4)+4)%4===0?2:1,LH-16);}
  c.fillStyle='#FFD25A';c.fillRect(HITX-19,8,38,LH-16);c.fillStyle='#5E3A1E';c.fillRect(HITX-15,12,30,LH-24);
  const flash=(ac&&now-hitAt<0.1);c.fillStyle=flash?'rgba(255,210,90,0.55)':'rgba(255,210,90,0.18)';c.fillRect(HITX-11,16,22,LH-32);
  const arr=inf.events.filter(e=>{const x=X(e.bpos);return x>-80&&x<LW+60;});
  arr.forEach(e=>{const x=X(e.bpos),len=e.dur/4*BEAT_PX;if(!HOLD_T[e.type]){c.fillStyle=e.rest?'rgba(159,216,255,0.35)':'rgba(255,244,220,0.3)';c.fillRect(Math.round(x),LH-16,Math.max(2,Math.round(len-3)),4);}if(HOLD_T[e.type]&&!e.rest)drawTail(c,e,x,X(e.bpos+e.dur/4),false);});
  drawSeq(c,arr,arr.map(e=>X(e.bpos)),NT,PX,i=>{const e=arr[i];if(e.rest)return ({keep:'#7FE0A8',broke:'#FF8A96'}[e.res]||'#8FD3FF');return {perfect:'#7FE0A8',good:'#FFD25A',miss:'#FF8A96'}[e.res]||'#FFF4DC';},()=>'transparent');
}

/* ---------- loop & input ---------- */
function frame(){const now=ac?ac.currentTime:performance.now()/1000;holdTick(now);tick(now);drawScene(now);drawLane(now);requestAnimationFrame(frame);}
document.addEventListener('keydown',e=>{if(e.code==='Space'||e.key===' '){if(e.target.tagName==='BUTTON'&&e.target.id!=='tapBtn'&&state!=='run'&&state!=='inf')return;e.preventDefault();if(e.repeat)return;if(state==='home'){state='ready';renderPlay();return;}tap();}});
document.getElementById('laneWrap').addEventListener('pointerdown',e=>{if(state==='run'||state==='inf'){e.preventDefault();tap();}});
document.getElementById('soundBtn').onclick=e=>{save.sound=!save.sound;persist();if(master)master.gain.value=save.sound?1:0;e.currentTarget.textContent=save.sound?'♪ 소리 켬':'♪ 소리 끔';};
document.getElementById('soundBtn').textContent=save.sound?'♪ 소리 켬':'♪ 소리 끔';
const tabs={tabPlay:'panelPlay',tabRoom:'panelRoom',tabBook:'panelBook'};
Object.keys(tabs).forEach(id=>document.getElementById(id).onclick=()=>{Object.keys(tabs).forEach(k=>{document.getElementById(k).setAttribute('aria-selected',k===id);document.getElementById(tabs[k]).hidden=k!==id;});if(id==='tabRoom')renderRoom();if(id==='tabBook')renderBook();});
document.querySelectorAll('[data-icon]').forEach(cv=>iconCanvas(cv,cv.dataset.icon));
(()=>{const c=document.getElementById('logo').getContext('2d');c.fillStyle='#FFD25A';c.fillRect(0,0,12,12);glyph(c,G.note.filter((_,i)=>i%2===0||i>10),3,1,1,'#5A3418');})();
const fitEl=document.getElementById('fit'),gameEl=document.getElementById('game');
function fit(){const w=fitEl.clientWidth,h=fitEl.clientHeight;if(!w||!h)return;const land=w/h>=1.1,was=gameEl.classList.contains('land');gameEl.classList.toggle('land',land);gameEl.classList.toggle('port',!land);
  setSceneMode(!land);const W=land?1000:420,H=land?654:700,sc2=Math.min((w-8)/W,(h-8)/H);gameEl.style.transform='translate(-50%,-50%) scale('+sc2+')';if(was!==land&&state!=='run'&&typeof renderPlay==='function')renderPlay();}
addEventListener('resize',fit);addEventListener('orientationchange',()=>setTimeout(fit,200));fit();
updateTop();renderPlay();
/* ---------- 생각 오락실 통합 계정 ---------- */
function refreshAll(){if(master)master.gain.value=save.sound?1:0;document.getElementById('soundBtn').textContent=save.sound?'♪ 소리 켬':'♪ 소리 끔';
  if(state==='run'||state==='inf')return;stageIdx=Math.min(stageIdx,STAGES.length-1);if(!stageOpen(stageIdx)){stageIdx=0;roundIdx=0;}if(state!=='home'){state='home';run=null;inf=null;}
  updateTop();renderPlay();if(!document.getElementById('panelRoom').hidden)renderRoom();if(!document.getElementById('panelBook').hidden)renderBook();}
function openAcc(){if(AA)AA.open({game:'beat',gameName:'숲속 박자 음악회',color:'#FFD25A',onPlay:()=>{}});}
function setUser(a){
  const gate=document.getElementById('gate');
  if(!a){if(me)push(true);me=null;dirty=false;sync='';applySave(null);gate.hidden=false;refreshAll();return;}
  if(me&&me.nick===a.nick){me.pin=a.pin;return;}
  if(me)push(true);
  me={nick:a.nick,pin:a.pin};dirty=false;gate.hidden=true;
  let local=null;try{local=JSON.parse(localStorage.getItem(ukey(a.nick))||'null');}catch(e){}
  applySave(local);sync=SAVE_API?'load':'';refreshAll();
  if(!SAVE_API)return;
  const who=me;
  api({action:'load',nick:a.nick,pin:a.pin}).then(j=>{if(me!==who)return;
    if(!j.ok){if(['PIN','NOUSER','BLOCKED'].includes(j.code)){AA.logout();return;}setSync('off');if(local){dirty=true;}return;}
    const sv=j.data;
    if(sv&&(!local||(sv.t||0)>=(local.t||0))){applySave(sv);try{localStorage.setItem(ukey(a.nick),JSON.stringify(save));}catch(e){}setSync('ok');refreshAll();}
    else if(local){dirty=true;push();}else setSync('ok');
  }).catch(()=>{if(me===who){if(local)dirty=true;setSync('off');}});}
if(AA){document.getElementById('gateBtn').onclick=openAcc;AA.onChange(setUser);const a0=AA.get();if(a0){setUser(a0);AA.refresh();}else{document.getElementById('gate').hidden=false;openAcc();}}
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(()=>{});
requestAnimationFrame(frame);
})();
